<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Noto Serif SC', Georgia, 'SimSun', serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#57534C" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#F5F2EC"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <!-- moon gate -->
  <circle cx="150" cy="130" r="86" fill="#FCFAF6" stroke="#B4693F" stroke-width="2"/>
  <path d="M64,130 A86,86 0 0 1 236,130" fill="none" stroke="#A87E2F" stroke-width="5" stroke-dasharray="2 7"/>
  <!-- interior hint of a path -->
  <path d="M112,204 Q150,168 188,204" fill="none" stroke="#8B857A" stroke-width="1.5" opacity="0.7"/>
  <path d="M128,214 Q150,190 172,214" fill="none" stroke="#8B857A" stroke-width="1" opacity="0.5"/>
  <!-- bamboo accent -->
  <g stroke="#B4693F" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M320,300 V60"/><path d="M348,300 V92"/>
  </g>
  <g stroke="#C97E5C" stroke-width="2" fill="none" opacity="0.7">
    <path d="M320,110 q-22,-8 -32,-28"/><path d="M348,140 q20,-6 30,-24"/>
    <path d="M320,180 q-20,-4 -34,-20"/>
  </g>
  <text x="200" y="272" text-anchor="middle" fill="#57534C" font-size="13" letter-spacing="4">豫园一隅 · 上海</text>
</svg>
