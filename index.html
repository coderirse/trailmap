<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>足迹地图 — Trail Map</title>

  <!-- Google Fonts — Noto Serif SC + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Noto+Serif+SC:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Leaflet CSS (CDN) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body>
  <div id="app">
    <!-- ==========================================================
         Left Navigation — Griffin minimal location list + stats
         ========================================================== -->
    <!-- Mobile backdrop -->
    <div id="nav-backdrop" class="sidebar-backdrop"></div>

    <nav id="sidebar">
      <div class="nav-header">
        <div class="nav-title">足迹地图</div>
        <div class="nav-subtitle">Trail Map</div>
      </div>

      <div id="nav-locations" class="nav-locations">
        <!-- Populated by Sidebar.js -->
      </div>

      <div class="nav-footer">
        <div id="nav-stats" class="nav-stats">
          <!-- Populated by Sidebar.js -->
        </div>
      </div>
    </nav>

    <!-- Mobile drawer handle -->
    <button id="nav-drawer-handle" aria-label="打开导航">
      <span class="handle-bar"></span>
    </button>

    <!-- ==========================================================
         Map area
         ========================================================== -->
    <div id="map-container">
      <div id="map"></div>

      <!-- Floating header — Griffin 72px light title -->
      <header class="map-header">
        <h1 class="map-title">足迹地图</h1>
        <p class="map-subtitle"><span id="location-count">0</span> locations · select a marker</p>
      </header>
    </div>

    <!-- ==========================================================
         Detail panel — slides in to the right of nav
         ========================================================== -->
    <aside id="detail-panel">
      <div id="sidebar-content">
        <!-- Populated by Sidebar.js -->
      </div>
    </aside>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <!-- Vite entry -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
